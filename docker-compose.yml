services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudflux-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudflux
      POSTGRES_PASSWORD: cloudflux
      POSTGRES_DB: cloudflux
    ports:
      - "5432:5432"
    volumes:
      - cloudflux-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudflux -d cloudflux"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudflux-postgres-data:
